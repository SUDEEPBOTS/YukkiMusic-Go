<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Playeon Room · Yukki</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #08080a;
      --bg-sheet: #12131d;
      --bg-card: #181a28;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --seek-fill: linear-gradient(90deg, #6366f1 0%, #3b82f6 50%, #06b6d4 100%);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: #f8fafc;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .vinyl-disc {
      animation: rotateDisc 18s linear infinite;
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.8), 0 0 30px rgba(99, 102, 241, 0.25);
    }
    .vinyl-paused {
      animation-play-state: paused !important;
    }
    @keyframes rotateDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    /* Floating Emojis Reaction Particle */
    .floating-emoji {
      position: absolute;
      bottom: 60px;
      font-size: 26px;
      pointer-events: none;
      animation: floatUp 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      z-index: 50;
    }
    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0.6) rotate(0deg);
      }
      50% {
        opacity: 0.9;
        transform: translateY(-160px) scale(1.3) rotate(15deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-300px) scale(1.1) rotate(-15deg);
      }
    }
    /* Seek Slider Custom Track */
    .seek-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 9999px;
      background: #222538;
      outline: none;
      position: relative;
    }
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(99, 102, 241, 1), 0 2px 6px rgba(0,0,0,0.6);
      border: 3px solid #6366f1;
      transition: transform 0.1s ease;
    }
    .seek-slider::-webkit-slider-thumb:active {
      transform: scale(1.3);
    }
    /* Equalizer Wave */
    .eq-bar {
      width: 3px;
      height: 14px;
      border-radius: 2px;
      background: #10b981;
      animation: eqBounce 1.1s ease-in-out infinite alternate;
    }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; height: 18px; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; height: 10px; }
    .eq-bar:nth-child(4) { animation-delay: 0.1s; height: 16px; }
    @keyframes eqBounce {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1.15); }
    }
    .eq-paused .eq-bar {
      animation-play-state: paused;
      transform: scaleY(0.3);
    }
    .glass-card {
      background: rgba(22, 24, 38, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .active-nav {
      background: #6366f1 !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="p-3.5 pb-safe pt-safe flex flex-col justify-between select-none">

  <!-- TOP BAR: User Info + Room Badge -->
  <header class="flex items-center justify-between px-1 py-1.5 shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="relative">
        <img id="userAvatar" src="https://yukiapi.site/file/iCggpP12" class="w-9 h-9 rounded-full object-cover border border-white/20 shadow-md" />
        <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-darkbg"></span>
      </div>
      <div>
        <h2 id="userName" class="text-xs font-bold text-white tracking-tight leading-tight">Telegram User</h2>
        <p id="userHandle" class="text-[10px] text-slate-400 font-mono">@user</p>
      </div>
    </div>

    <!-- Live Audio Equalizer & Room Badge -->
    <div class="flex items-center gap-2 bg-cardbg/90 border border-white/10 px-3 py-1.5 rounded-2xl shadow-sm">
      <div id="eqWave" class="flex items-center gap-0.5">
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
      </div>
      <span class="text-[11px] font-bold text-emerald-400 tracking-wider">LIVE</span>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <nav class="flex items-center justify-between bg-cardbg/90 border border-white/5 rounded-2xl p-1 shrink-0 my-2">
    <button onclick="changeTab('player')" id="nav-player" class="active-nav flex-1 py-2 rounded-xl text-xs font-bold text-slate-400 transition-all flex items-center justify-center gap-1.5">
      <span>🎵</span> Room
    </button>
    <button onclick="changeTab('queue')" id="nav-queue" class="flex-1 py-2 rounded-xl text-xs font-bold text-slate-400 transition-all flex items-center justify-center gap-1.5">
      <span>📑</span> Queue <span id="badgeQueue" class="text-[10px] bg-white/10 px-1.5 py-0.2 rounded-full">0</span>
    </button>
    <button onclick="changeTab('search')" id="nav-search" class="flex-1 py-2 rounded-xl text-xs font-bold text-slate-400 transition-all flex items-center justify-center gap-1.5">
      <span>🔍</span> Search
    </button>
  </nav>

  <!-- STAGE / REACTION FLOATING AREA -->
  <div id="reactionContainer" class="relative flex-1 flex flex-col overflow-hidden">

    <!-- VIEW 1: NOW PLAYING STAGE -->
    <div id="view-player" class="flex-1 flex flex-col justify-between items-center py-2 h-full">

      <!-- Vinyl Disc Artwork -->
      <div class="relative my-auto flex items-center justify-center">
        <div id="discElement" class="w-52 h-52 sm:w-60 sm:h-60 rounded-full p-2 bg-gradient-to-tr from-slate-950 via-slate-900 to-black border border-white/10 flex items-center justify-center vinyl-disc">
          <!-- Inner Groove Ring -->
          <div class="w-full h-full rounded-full border-4 border-dashed border-white/10 flex items-center justify-center bg-black/60">
            <img id="artwork" src="https://yukiapi.site/file/iCggpP12" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full object-cover shadow-inner border-2 border-brand-500" />
          </div>
          <!-- Spindle Pin -->
          <div class="absolute w-5 h-5 rounded-full bg-slate-900 border-2 border-white/40 shadow-lg"></div>
        </div>
      </div>

      <!-- Track Information Card -->
      <div class="w-full text-center px-4 my-2">
        <h1 id="trackTitle" class="text-base font-extrabold text-white truncate">No Song Playing</h1>
        <div class="flex items-center justify-center gap-2 mt-1">
          <span class="text-[10px] bg-brand-500/20 text-brand-400 border border-brand-500/30 px-2 py-0.5 rounded-md font-semibold">Voice Chat</span>
          <span id="trackRequester" class="text-[11px] text-slate-400 font-medium truncate">Waiting for playback</span>
        </div>
      </div>

      <!-- Seekbar Slider -->
      <div class="w-full px-4 mb-2.5">
        <input type="range" id="seekSlider" min="0" max="100" value="0" class="seek-slider cursor-pointer" oninput="onSeekMove(this.value)" onchange="onSeekCommit(this.value)" />
        <div class="flex justify-between text-[11px] font-mono font-bold text-slate-400 mt-1.5">
          <span id="timeCurrent">00:00</span>
          <span id="timeDuration">00:00</span>
        </div>
      </div>

      <!-- Playback Controls -->
      <div class="w-full flex items-center justify-center gap-3 px-4 mb-2">
        <button onclick="sendAction('seek', -15)" class="w-11 h-11 rounded-2xl glass-card flex items-center justify-center text-slate-200 active:scale-90 transition-transform font-mono text-xs font-bold">
          -15s
        </button>
        <button onclick="sendAction('replay')" class="w-11 h-11 rounded-2xl glass-card flex items-center justify-center text-slate-200 active:scale-90 transition-transform text-lg">
          ⟳
        </button>
        <button onclick="togglePlayState()" id="btnPlayPause" class="w-14 h-14 rounded-3xl bg-brand-500 hover:bg-brand-600 text-white flex items-center justify-center text-xl shadow-xl shadow-brand-500/40 active:scale-90 transition-all">
          ⏸
        </button>
        <button onclick="sendAction('skip')" class="w-11 h-11 rounded-2xl glass-card flex items-center justify-center text-slate-200 active:scale-90 transition-transform text-lg">
          ⏭
        </button>
        <button onclick="sendAction('seek', 15)" class="w-11 h-11 rounded-2xl glass-card flex items-center justify-center text-slate-200 active:scale-90 transition-transform font-mono text-xs font-bold">
          +15s
        </button>
      </div>

      <!-- Reaction Emojis Row (Playeon Feature) -->
      <div class="flex items-center justify-center gap-2 overflow-x-auto w-full px-2 py-1.5 no-scrollbar">
        <button onclick="spawnReaction('❤️')" class="text-xl p-1.5 rounded-xl hover:bg-white/10 active:scale-125 transition-transform">❤️</button>
        <button onclick="spawnReaction('🔥')" class="text-xl p-1.5 rounded-xl hover:bg-white/10 active:scale-125 transition-transform">🔥</button>
        <button onclick="spawnReaction('👏')" class="text-xl p-1.5 rounded-xl hover:bg-white/10 active:scale-125 transition-transform">👏</button>
        <button onclick="spawnReaction('🎉')" class="text-xl p-1.5 rounded-xl hover:bg-white/10 active:scale-125 transition-transform">🎉</button>
        <button onclick="spawnReaction('😂')" class="text-xl p-1.5 rounded-xl hover:bg-white/10 active:scale-125 transition-transform">😂</button>
        <button onclick="spawnReaction('😍')" class="text-xl p-1.5 rounded-xl hover:bg-white/10 active:scale-125 transition-transform">😍</button>
        <button onclick="spawnReaction('😎')" class="text-xl p-1.5 rounded-xl hover:bg-white/10 active:scale-125 transition-transform">😎</button>
        <button onclick="spawnReaction('💀')" class="text-xl p-1.5 rounded-xl hover:bg-white/10 active:scale-125 transition-transform">💀</button>
      </div>

    </div>

    <!-- VIEW 2: QUEUE LIST -->
    <div id="view-queue" class="hidden flex-1 flex flex-col w-full h-full overflow-hidden">
      <div class="flex items-center justify-between pb-2 border-b border-white/5">
        <h3 class="text-xs font-bold text-white flex items-center gap-1.5">
          <span>📑</span> Playeon Queue
        </h3>
        <button onclick="sendAction('clear_queue')" class="text-[11px] text-red-400 font-semibold hover:underline">
          Clear Queue
        </button>
      </div>
      <div id="listQueue" class="flex-1 overflow-y-auto space-y-2 py-3 no-scrollbar">
        <p class="text-center text-xs text-slate-500 py-10">Queue is currently empty</p>
      </div>
    </div>

    <!-- VIEW 3: IN-APP SEARCH -->
    <div id="view-search" class="hidden flex-1 flex flex-col w-full h-full overflow-hidden">
      <div class="flex gap-2 pb-2.5">
        <input type="text" id="inputSearch" placeholder="Search YouTube tracks..." class="flex-1 bg-cardbg border border-white/10 rounded-2xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-brand-500" onkeydown="if(event.key==='Enter') executeSearch()" />
        <button onclick="executeSearch()" class="bg-brand-500 text-white px-4 rounded-2xl text-xs font-bold shadow-md shadow-brand-500/30 active:scale-95">
          Search
        </button>
      </div>
      <div id="listSearch" class="flex-1 overflow-y-auto space-y-2 py-1 no-scrollbar">
        <p class="text-center text-xs text-slate-500 py-10">Type a song name to search and play in Voice Chat</p>
      </div>
    </div>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.enableClosingConfirmation();
    }

    // Load Telegram User Profile
    let activeUser = "Telegram User";
    let activeUsername = "@user";
    let activePhoto = "https://yukiapi.site/file/iCggpP12";

    if (tg?.initDataUnsafe?.user) {
      const u = tg.initDataUnsafe.user;
      activeUser = u.first_name + (u.last_name ? " " + u.last_name : "");
      activeUsername = u.username ? "@" + u.username : "ID: " + u.id;
      if (u.photo_url) activePhoto = u.photo_url;
    }

    document.getElementById("userName").innerText = activeUser;
    document.getElementById("userHandle").innerText = activeUsername;
    document.getElementById("userAvatar").src = activePhoto;

    // Resolve Chat ID
    const searchParams = new URLSearchParams(window.location.search);
    let currentChatID = searchParams.get('startapp') || searchParams.get('chat_id') || '0';
    if (!currentChatID || currentChatID === '0') {
      if (tg?.initDataUnsafe?.start_param) {
        currentChatID = tg.initDataUnsafe.start_param;
      } else if (window.location.hash) {
        const hParams = new URLSearchParams(window.location.hash.substring(1));
        const tgData = hParams.get('tgWebAppData');
        if (tgData) {
          const parsed = new URLSearchParams(tgData);
          currentChatID = parsed.get('start_param') || '0';
        }
      }
    }

    let isSeeking = false;
    let trackPaused = false;
    let maxDuration = 0;

    function vibrate() {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }
    }

    function changeTab(tabName) {
      vibrate();
      ['player', 'queue', 'search'].forEach(t => {
        document.getElementById('view-' + t).classList.add('hidden');
        document.getElementById('nav-' + t).classList.remove('active-nav');
        document.getElementById('nav-' + t).classList.add('text-slate-400');
      });
      document.getElementById('view-' + tabName).classList.remove('hidden');
      const activeNav = document.getElementById('nav-' + tabName);
      activeNav.classList.add('active-nav');
      activeNav.classList.remove('text-slate-400');
    }

    function formatSeconds(secs) {
      if (isNaN(secs) || secs < 0) return '00:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    // Reaction Animation Generator
    function spawnReaction(emoji) {
      vibrate();
      const container = document.getElementById('reactionContainer');
      const particle = document.createElement('div');
      particle.className = 'floating-emoji';
      particle.innerText = emoji;
      
      // Randomize horizontal starting position
      const offset = 20 + Math.random() * 60;
      particle.style.left = offset + '%';
      
      container.appendChild(particle);
      setTimeout(() => particle.remove(), 2200);
    }

    async function syncState() {
      try {
        const res = await fetch('/api/room?chat_id=' + encodeURIComponent(currentChatID));
        const state = await res.json();
        renderState(state);
      } catch (err) {
        console.error('State sync error:', err);
      }
    }

    function renderState(data) {
      const eq = document.getElementById('eqWave');
      const disc = document.getElementById('discElement');
      const playBtn = document.getElementById('btnPlayPause');

      if (!data || !data.active) {
        document.getElementById('trackTitle').innerText = 'No Song Playing';
        document.getElementById('trackRequester').innerText = 'Play via search or group VC';
        document.getElementById('timeCurrent').innerText = '00:00';
        document.getElementById('timeDuration').innerText = '00:00';
        document.getElementById('seekSlider').value = 0;
        disc.classList.add('vinyl-paused');
        eq.classList.add('eq-paused');
        playBtn.innerText = '▶';
        return;
      }

      const t = data.track;
      if (t) {
        document.getElementById('trackTitle').innerText = t.title || 'Playing Stream';
        document.getElementById('trackRequester').innerText = t.requester ? 'by ' + t.requester.replace(/<[^>]*>?/gm, '') : 'In Group VC';
        if (t.artwork) document.getElementById('artwork').src = t.artwork;

        maxDuration = t.duration || 0;
        document.getElementById('timeDuration').innerText = formatSeconds(maxDuration);

        if (!isSeeking) {
          const pos = t.position || 0;
          document.getElementById('timeCurrent').innerText = formatSeconds(pos);
          const percent = maxDuration > 0 ? (pos / maxDuration) * 100 : 0;
          document.getElementById('seekSlider').value = percent;
        }
      }

      trackPaused = data.is_paused;
      if (trackPaused) {
        playBtn.innerText = '▶';
        disc.classList.add('vinyl-paused');
        eq.classList.add('eq-paused');
      } else {
        playBtn.innerText = '⏸';
        disc.classList.remove('vinyl-paused');
        eq.classList.remove('eq-paused');
      }

      // Queue list
      const q = data.queue || [];
      document.getElementById('badgeQueue').innerText = q.length;
      const listQ = document.getElementById('listQueue');
      if (q.length === 0) {
        listQ.innerHTML = '<p class="text-center text-xs text-slate-500 py-10">Queue is currently empty</p>';
      } else {
        listQ.innerHTML = q.map((item, idx) => `
          <div class="flex items-center justify-between p-2.5 bg-cardbg/90 border border-white/5 rounded-2xl gap-3">
            <div class="flex items-center gap-2.5 overflow-hidden">
              <span class="text-xs font-mono font-bold text-slate-500 w-4">${idx + 1}</span>
              <img src="${item.artwork || 'https://yukiapi.site/file/iCggpP12'}" class="w-10 h-10 rounded-xl object-cover" />
              <div class="truncate">
                <p class="text-xs font-bold text-white truncate">${item.title}</p>
                <p class="text-[10px] text-slate-400 font-mono">${formatSeconds(item.duration)}</p>
              </div>
            </div>
            <button onclick="sendAction('remove_queue', ${idx})" class="w-7 h-7 rounded-lg bg-red-500/10 text-red-400 flex items-center justify-center text-xs">✕</button>
          </div>
        `).join('');
      }
    }

    async function sendAction(action, value = 0) {
      vibrate();
      try {
        await fetch('/api/room/control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: currentChatID, action: action, value: value })
        });
        syncState();
      } catch (err) {
        console.error('Control error:', err);
      }
    }

    function togglePlayState() {
      if (trackPaused) {
        sendAction('resume');
      } else {
        sendAction('pause');
      }
    }

    function onSeekMove(val) {
      isSeeking = true;
      const sec = (val / 100) * maxDuration;
      document.getElementById('timeCurrent').innerText = formatSeconds(sec);
    }

    function onSeekCommit(val) {
      isSeeking = false;
      const targetSec = Math.floor((val / 100) * maxDuration);
      sendAction('seek_absolute', targetSec);
    }

    async function executeSearch() {
      const q = document.getElementById('inputSearch').value.trim();
      if (!q) return;
      vibrate();
      const resList = document.getElementById('listSearch');
      resList.innerHTML = '<p class="text-center text-xs text-brand-400 py-10 animate-pulse">Searching tracks...</p>';
      try {
        const res = await fetch('/api/room/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q })
        });
        const results = await res.json();
        if (!results || results.length === 0) {
          resList.innerHTML = '<p class="text-center text-xs text-slate-500 py-10">No tracks found</p>';
          return;
        }
        resList.innerHTML = results.map(t => `
          <div class="flex items-center justify-between p-2 bg-cardbg/90 border border-white/5 rounded-2xl gap-3">
            <div class="flex items-center gap-2.5 overflow-hidden">
              <img src="${t.artwork || 'https://yukiapi.site/file/iCggpP12'}" class="w-11 h-11 rounded-xl object-cover shrink-0" />
              <div class="truncate">
                <p class="text-xs font-bold text-white truncate">${t.title}</p>
                <p class="text-[10px] text-slate-400 font-mono">${formatSeconds(t.duration)}</p>
              </div>
            </div>
            <button onclick="queueTrack('${encodeURIComponent(t.url || t.id)}')" class="px-3 py-1.5 bg-brand-500 text-white rounded-xl text-xs font-bold shrink-0 active:scale-95 shadow-md shadow-brand-500/30">
              + Play
            </button>
          </div>
        `).join('');
      } catch (err) {
        resList.innerHTML = '<p class="text-center text-xs text-red-400 py-10">Search failed</p>';
      }
    }

    async function queueTrack(encodedUrl) {
      vibrate();
      try {
        await fetch('/api/room/play', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: currentChatID, query: decodeURIComponent(encodedUrl), by: activeUser })
        });
        changeTab('player');
        syncState();
      } catch (err) {
        alert('Playback error: ' + err);
      }
    }

    // Auto sync state every 1.5s
    syncState();
    setInterval(syncState, 1500);
  </script>
</body>
</html>
